# =============================================================================
# ARCHIVO DE CONFIGURACIÓN TMUX (.tmux.conf) - VERSIÓN ULTRA-RENDIMIENTO
# =============================================================================

# -----------------------------------------------------------------------------
# 1. PARAMETRIZACIÓN DEL PREFIJO & NÚCLEO DEL ENTORNO
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Configuración estricta de color y compatibilidad True-Color (Termguicolors)
set -s default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment WAYLAND_DISPLAY
set -ga update-environment SWAYSOCK

# 1. Informar a tmux sobre las capacidades de Foot (True Color y Sixel)
set -as terminal-features ',foot:RGB:sixel'
# 2. Habilitar explícitamente la secuencia de escape Sixel (Nota el cambio a 'sixel' sin 's')
set -as terminal-overrides ',foot:sixel'
# 3. Soporte para el portapapeles (OSC 52) corregido
#set -as terminal-overrides ',foot:Ms=\\E]52;c;%p2%s\\7'


#set -as terminal-overrides ",foot:sixels"
#set -as terminal-overrides ",foot:Ms=\\E]52;c;%p2%s\\7"
#set -as terminal-features ',foot:RGB:sixel'

set -g base-index 1
set -g pane-base-index 1
set -g mouse on
set -g display-panes-time 800
set -g history-limit 50000          # Incrementado para auditorías de logs largos
set -g status-interval 5            # Actualización más rápida pero eficiente
set-option -g renumber-windows on
# Desactivar ruidos y activar monitoreo silencioso
set -g visual-activity off
setw -g monitor-activity on

# -----------------------------------------------------------------------------
# 2. DISEÑO GRÁFICO, PALETA DE COLORES & ESTILOS
# -----------------------------------------------------------------------------
set -g status on
setw -g window-status-separator ""
set -g window-active-style bg=colour234

# Paleta de Variables Limpias
bg_red="#[bg=#f38ba8]"
fg_green="#[bg=#a6e3a1,fg=#313244,bold]"
bg_blue="#[bg=#89b4fa,fg=#313244,bold]"
bg_dark_gray="#[bg=#313244,fg=#cdd6f4]"
fg_gray="#[fg=#8a8a8a]"
bg_green="#[bg=#a6e3a1]"

set -g message-style "bg=#89dceb,fg=#313244"
set -g mode-style "bg=#89dceb,fg=#313244"

# Bordes Inteligentes Dinámicos (Normal, Modo Copia, Paneles Sincronizados)
set -g pane-active-border-style "#{?pane_in_mode,fg=#89dceb,#{?synchronize-panes,fg=#f38ba8,fg=green}}"
set -g pane-border-style fg=#313244

# Barra de Estado Superior / Inferior
set -g status-justify left
set -g status-style "bg=#11111b,fg=colour245" # Fondo ultra oscuro uniforme

# Formato del listado de Ventanas (Minimizando ruido visual)
set -g status-left ""
set -g window-status-format "#[bg=#313244,bold] #I #[bg=#1e1e2e,fg=#8a8a8a] #{b:pane_current_path} "
set -g window-status-current-format "#[bg=#89b4fa,fg=#313244,bold] #I #[bg=#1e1e2e,fg=#89b4fa,bold] #W "

# Telemetría de Alto Rendimiento (Parsea /proc en lugar de invocar top/free)
cpu_percentage=" #(awk '/cpu /{print int(100-($5*100)/($2+$3+$4+$5+$6+$7+$8))}' /proc/stat)%%"
ram_status="󰾆 #(awk '/MemTotal/{t=$2}/MemAvailable/{a=$2}END{printf \"%.1fG/%.1fG\", (t-a)/1024/1024, t/1024/1024}' /proc/meminfo)"
prefix_status="#{?client_prefix,$bg_red,$bg_green}"
session="#[fg=#1e1e2e] #S "

#set -g status-right "$cpu_percentage $ram_status $prefix_status $session"
set -g status-right "$prefix_status $session"

# -----------------------------------------------------------------------------
# 3. ATAJOS DE TECLADO & CONTROL DE PANELES
# -----------------------------------------------------------------------------
# Recarga rápida del archivo de configuración
bind r source-file ~/.tmux.conf \; display-message "Configuración de Tmux Desplegada e Indexada"

# Creación de paneles nemotécnicos con retención de ruta actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Sincronización de comandos en paneles (Útil para servidores/clústers)
bind a setw synchronize-panes \; display-message "Sincronización de Paneles Alterada"

# Layout Complejo e Inteligente Estilo Dashboard (Tu macro optimizada)
bind-key M-d split-window -h -c "#{pane_current_path}" \; split-window -v -t 2 -c "#{pane_current_path}" \; select-pane -t 1

# Navegación Fluida e Integrada entre Vim y Tmux (Requiere el plugin vim-tmux-navigator en tu Vim)
#bind-key -n 'C-h' run-shell "tmux select-pane -L"
#bind-key -n 'C-j' run-shell "tmux select-pane -D"
#bind-key -n 'C-k' run-shell "tmux select-pane -U"
#bind-key -n 'C-l' run-shell "tmux select-pane -R"

# Buscar directorios con FZF y abrirlos en una nueva sesión dedicada de Tmux
bind-key C-f run-shell "tmux neww ~/.config/bin/tmux-sessionizer"

# Cambiar entre pantalla completa del panel actual y vista dividida
bind-key z resize-pane -Z



# -----------------------------------------------------------------------------
# 4. ENTORNO DE COPIADO MODO VI (INTEGRACIÓN CON EL PORTAPAPELES)
# -----------------------------------------------------------------------------
setw -g mode-keys vi
set -g set-clipboard on

# Configuración y bindings nativos compatibles con tmux-yank
set -g @yank_with_mouse on
set -g @yank_selection_mouse 'clipboard'

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
# Nota: La tecla 'y' ya la maneja asíncronamente el plugin tmux-yank de abajo.

# -----------------------------------------------------------------------------
# 5. GESTOR DE COMPLEMENTOS (TPM - TMUX PLUGIN MANAGER)
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Inicialización obligatoria al final del archivo
run '~/.tmux/plugins/tpm/tpm'
